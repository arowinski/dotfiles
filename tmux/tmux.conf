# Set prefix key to more convenient C-s
unbind C-b
set -g prefix C-s
bind -r C-s send-prefix

# Reload .tmux.conf
bind r source-file ~/.config/tmux/tmux.conf \; display-message "TMUX configuration reloaded"

# Use zsh on start
set -g default-command "zsh"

# Start windows from 1, automatically renumber
set -g base-index 1
set -g renumber-windows on

# Display pane indicator (<prefix> q) for N ms
set -g display-panes-time 400

# Better colors
set -g default-terminal 'xterm-256color'

# Keep history for scrollback
set -g history-limit 50000

# Stay in tmux when closing a session
set -g detach-on-destroy off

# Better modifier key detection
set -g extended-keys on

# Use emacs key-bindings at status/command prompt (<prefix>:)
set -g status-keys emacs

# Vim mode switching delay (http://superuser.com/a/252717/65504)
set-option -sg escape-time 0

# Vim FocusGained and FocusLost autocommand events don't work without it
set-option -g focus-events on

# Turn off mouse supoport (select pane, window, resize and scroll)
set -g mouse off

# Use vi key-bindings in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi Space
bind -T copy-mode-vi Space send -X jump-again
bind -T copy-mode-vi 0 send -X back-to-indentation
bind y run 'tmux save-buffer - | pbcopy '
bind C-y run 'tmux save-buffer - | pbcopy '

# Use incremental search in copy mode
bind  -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind  -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""

# Switch to next/previous session (skip dev-managed sessions)
bind -n S-Up run 'tmux-switch-session next'
bind -n S-Down run 'tmux-switch-session prev'

# Session manager with FZF
bind C-j display-popup -E -w20% -h20% 'tmux-session-manager'

# Scroll pane with PageUp/PageDown
bind -n PageUp copy-mode \; send-keys -X halfpage-up
bind -n PageDown copy-mode
bind -T copy-mode-vi PageUp send -X halfpage-up
bind -T copy-mode-vi PageDown send -X halfpage-down

# Switch to next/previous window
bind -n S-Right next-window
bind -n S-Left previous-window

# Resize pane
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Down resize-pane -D 5
bind -n M-Up resize-pane -U 5


# Status bar
set -g status-bg '#666666'
set -g status-fg '#aaaaaa'
# 15, not 5: `ws status` in status-right costs ~0.5s CPU per run
set -g status-interval 15

# One mark per pane whose Claude is waiting on you (⏳) or finished a turn (✓)
# since you last focused it — set by notify-claude, cleared on focus.
# ✓ is a green badge; each format restores its own style right after the marks.
%hidden CLAUDE_MARKS="#{P:#{?#{==:#{@claude_mark},ask}, ⏳,}#{?#{==:#{@claude_mark},done}, #[bg=colour2#,fg=colour232#,bold] ✓ ,}}"
set -g window-status-current-format "#[fg=colour241]#[bg=colour4]#[fg=colour232]   #W${CLAUDE_MARKS}#[bg=colour4,fg=colour232,nobold]   #[fg=colour241]"
set -g window-status-format "#[fg=colour249]#[bg=colour240] [#I]#[fg=colour252] #W${CLAUDE_MARKS}#[bg=colour240,fg=colour252,nobold] "
set -g status-left '#[bg=colour7]#[fg=colour16]#{?client_prefix,#[bg=colour3],} #S #[bg=colour107]#[fg=colour7]#{?client_prefix,#[fg=colour3],}#{?window_zoomed_flag, 🔍 ,}'
set -g status-left-length 30
set -g status-right-length 100
set -g status-right "#(ws status) #[bg=colour16]#[fg=colour250]  #(date '+%b %d - %H:%M') "

# Window and pane styles
set -g window-style 'bg=colour235'
set -g window-active-style 'bg=terminal'
set -g pane-border-style "fg=colour7"
set -g pane-active-border-style "fg=colour2"

# More convenient split window mappings
bind - split-window -v -c '#{pane_current_path}'
bind / split-window -h -c '#{pane_current_path}'

# Workspace shortcuts (ws + ws-popup live in the workspace tool's bin, on PATH via zshenv)
# W: create next workspace from origin/main (auto-picks pool name) + window
bind W display-popup -E -w 70% -h 50% "ws new"
# D: drop the current window's workspace (stop + destroy + remove + close).
# No popup: success closes the window; if it refuses (dirty worktree) the
# window stays open — re-run `ws drop` in that terminal to see why.
bind D confirm-before -p "drop workspace '#{window_name}'? (y/n) " \
  "run-shell \"ws drop '#{window_name}'\""
# a: toggle the process-compose TUI popup for the current window's workspace.
# run-shell expands #{window_name} (display-popup doesn't). ws-popup runs the
# TUI in a hidden tmux session with key-table `popup`, so prefix+a INSIDE the
# popup (C-s then a, below) detaches → closes it. Same keystroke toggles.
bind a run-shell "tmux display-popup -E -w 90% -h 90% 'ws-popup #{window_name}'"
bind -T popup C-s switch-client -T popup-prefix
bind -T popup-prefix a detach-client

# Redraw pane and clear history
bind C-l send-keys 'C-l'
bind l "send-keys -R\;clear-history\;send-keys C-l"

# Vim and fzf aware pane switching
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

is_fzf="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

bind -n C-Left run "(($is_vim || $is_fzf) && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-Down run "(($is_vim || $is_fzf) && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-Up run "(($is_vim || $is_fzf) && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-Right run "(($is_vim || $is_fzf) && tmux send-keys C-l) || tmux select-pane -R"

bind -T copy-mode-vi C-Left select-pane -L
bind -T copy-mode-vi C-Down select-pane -D
bind -T copy-mode-vi C-Up select-pane -U
bind -T copy-mode-vi C-Right select-pane -R

# Open current path in explorer
bind o run-shell "open '#{pane_current_path}'"

# Mappings
bind c new-window -c '#{pane_current_path}'
bind b break-pane -d
bind v confirm "respawn-pane -k"
bind x confirm kill-pane
bind k confirm kill-window
bind ! run-shell 'tmux switch-client -n \; kill-session -t "$(tmux display-message -p "#S")" || tmux kill-session'

# Enable copying to system clipboard
set -g set-clipboard on

# Clear Claude notifications when focusing pane
set-hook -g pane-focus-in 'run-shell -b "~/.bin/clear-claude-notifications #{hook_pane}"'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
# Easy copy of common patterns, there's bug when multiple panels are open
# Copy to clipboard with prefix + space
set -g @plugin 'fcsonline/tmux-thumbs'
run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux
set -g @thumbs-command 'echo -n {} | pbcopy'
# Jump with prefix + j
set -g @plugin 'schasse/tmux-jump'
# Persistent toggleable popups
set -g @plugin 'loichyan/tmux-toggle-popup'
set -g @popup-id-format "#{b:pane_current_path}/{popup_name}"

run '~/.tmux/plugins/tpm/tpm'
