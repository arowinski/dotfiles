---
- defaults:
    link:
      relink: true
      create: true

- clean: ["~", "~/.config"]

- link:
    ~/.config/mise/config.toml: mise/config.toml
    ~/.Brewfile: Brewfile
    ~/.bin: bin
    ~/.config/karabiner: karabiner
    ~/.config/process-compose: process-compose
    # macOS config home for process-compose (it reads here, not ~/.config) —
    # so TUI shortcuts (incl. `attach`) actually load.
    "~/Library/Application Support/process-compose": process-compose
    ~/.config/nvim: nvim
    ~/.config/git/config: git/gitconfig
    ~/.gitignore: git/gitignore
    ~/.psqlrc: psql/psqlrc
    ~/.rgignore: rgignore
    ~/.rspec: ruby/rspec
    ~/.config/tmux/tmux.conf: tmux/tmux.conf
    ~/.zlogin: zsh/zlogin
    ~/.zsh: zsh
    ~/.zshenv: zsh/zshenv
    ~/.zshrc: zsh/zshrc
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    ~/.claude/agents: claude/agents
    ~/.claude/commands: claude/commands
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/rules: claude/rules
    ~/.claude/skills: claude/skills
    ~/.dippy/config: dippy/config
    # rtk reads its config here on macOS. Carries the `cat` exclude that keeps
    # Read() deny rules working. force: `rtk init` creates the file first.
    "~/Library/Application Support/rtk/config.toml":
      path: rtk/config.toml
      force: true

